<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
:root {
  --text: #111111;
  --muted: #5f6368;
  --code-bg: #f4f4f4;
  --rule: #d9d9d9;
  --page: #ffffff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.62;
}
main {
  width: min(860px, calc(100% - 40px));
  margin: 0 auto;
  padding: 42px 0 72px;
}
p { margin: 0 0 18px; }
h1, h2, h3, h4, h5, h6 {
  color: var(--text);
  line-height: 1.25;
  margin: 34px 0 16px;
  font-weight: 700;
}
h1 { font-size: 28px; }
h2 { font-size: 24px; }
h3 { font-size: 20px; }
strong { font-weight: 700; }
em { font-style: italic; }
ul, ol {
  margin: 0 0 18px 1.35em;
  padding-left: 0.75em;
}
li { margin: 5px 0; }
hr {
  border: 0;
  border-top: 1px solid var(--rule);
  margin: 30px 0;
}
code:not(pre code) {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  background: var(--code-bg);
  border-radius: 5px;
  padding: 0.14em 0.35em;
  font-size: 0.92em;
}
div.highlight, figure.highlight, pre.highlight, pre {
  background: var(--code-bg);
  border-radius: 9px;
}
div.highlight, figure.highlight {
  margin: 12px 0 22px;
  overflow-x: auto;
}
div.highlight pre, figure.highlight pre, pre.highlight, pre {
  margin: 0;
  padding: 15px 17px;
  white-space: pre;
  tab-size: 4;
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 14px;
  line-height: 1.55;
}
.highlight .c, .highlight .c1, .highlight .cm { color: #3D7B7B; font-style: italic; }
.highlight .k, .highlight .kc, .highlight .kd, .highlight .kn, .highlight .kr { color: #008000; font-weight: bold; }
.highlight .kp { color: #008000; }
.highlight .o { color: #666; }
.highlight .ow { color: #A2F; font-weight: bold; }
.highlight .m, .highlight .mi, .highlight .mf { color: #666; }
.highlight .s, .highlight .s1, .highlight .s2, .highlight .sa, .highlight .sb, .highlight .sc, .highlight .sd { color: #BA2121; }
.highlight .nb, .highlight .bp { color: #008000; }
.highlight .nf { color: #00F; }
.highlight .nn { color: #00F; font-weight: bold; }
.highlight .nv { color: #19177C; }
blockquote {
  margin: 0 0 18px;
  padding-left: 16px;
  border-left: 4px solid var(--rule);
  color: #333;
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  main { width: min(100% - 28px, 860px); padding-top: 24px; }
  h1 { font-size: 25px; }
  h2 { font-size: 22px; }
  div.highlight pre, figure.highlight pre, pre.highlight, pre { padding: 13px 14px; font-size: 13px; }
}
@media print {
  body { font-size: 11pt; }
  main { width: 100%; padding: 0; }
  div.highlight, figure.highlight { break-inside: avoid; }
}
</style>
<script>
window.MathJax = {tex: {inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
