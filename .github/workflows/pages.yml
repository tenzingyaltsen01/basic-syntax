name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove company references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          p = Path("index.html")
          s = p.read_text()
          s = s.replace(
              "<title>DRW Python Data Assessment Syntax Briefing</title>",
              "<title>Python Data Assessment Syntax Briefing</title>",
          )

          m = re.search(r'const b="([A-Za-z0-9+/=]+)";', s)
          if m:
              body = gzip.decompress(base64.b64decode(m.group(1))).decode("utf-8")
              cleaned = body.replace("DRW-style ", "")
              cleaned = cleaned.replace(
                  "realistic 60-minute DRW data assessment",
                  "realistic 60-minute data assessment",
              )
              if cleaned != body:
                  payload = base64.b64encode(gzip.compress(cleaned.encode("utf-8"))).decode("ascii")
                  s = s[:m.start(1)] + payload + s[m.end(1):]
          p.write_text(s)

          for name in ["README.md", "part-01.html", "part-02.html"]:
              fp = Path(name)
              if fp.exists():
                  text = fp.read_text()
                  text = text.replace("DRW Syntax Briefing", "Syntax Briefing")
                  text = text.replace("DRW-style ", "")
                  text = text.replace(
                      "realistic 60-minute DRW data assessment",
                      "realistic 60-minute data assessment",
                  )
                  fp.write_text(text)
          PY

      - name: Commit cleaned source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove company references"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
